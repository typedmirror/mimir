name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: odin build src/ -collection:mimir=src/ -out:mimir -o:speed

      - name: Copy test-runner binary
        run: cp mimir mimir_bin

      - name: Fetch typeshed stubs
        run: ./mimir_bin stubs fetch

      - name: Run conformance tests
        run: ./mimir_bin conform tests/conformance/

      - name: Run smoke tests
        run: |
          for f in $(find tests/smoke -name '*.py' | sort); do
            echo "checking $f..."
            ./mimir_bin check "$f"
          done

      - name: Run t1 trust gate
        run: python3 tests/scripts/t1_trust_test.py

      - name: Run every-code-fires gate
        run: python3 tests/scripts/every_code_fires.py

      - name: Run LSP smoke gate
        run: python3 tests/scripts/lsp_smoke_test.py

      - name: Run GPU emit backend gate
        run: python3 tests/scripts/gpu_emit_backend_test.py

      - name: Run shim functional gate
        run: PYTHONPATH=python python3 tests/scripts/shim_functional_test.py

      # Metal execution leg (D-G2v2) — macOS-only: vendor:darwin/Metal does
      # not build on Linux. GitHub's macos-14 runners are not guaranteed to
      # expose a real Metal-capable device (m2: "assume nothing"); the test
      # itself renders SKIPPED(no-GPU) per-kernel and exits 0 in that case —
      # never blank, never a fabricated PASS, and never a hard CI failure.
      # It only fails the build on a real dispatch/correctness FAIL.
      - name: Build Metal parity runner
        if: matrix.os == 'macos-14'
        run: odin build tests/tools/metal_run.odin -file -out:tests/tools/metal_run_bin

      - name: Run GPU kernel parity gate (shim vs Metal device, SKIPPED-loud if no GPU)
        if: matrix.os == 'macos-14'
        run: PYTHONPATH=python python3 tests/scripts/kernel_parity_test.py

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mimir-${{ matrix.target }}
          path: mimir

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
