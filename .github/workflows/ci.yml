name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-13
            target: darwin-amd64
          - os: ubuntu-latest
            target: linux-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: odin build src/ -collection:mimir=src/ -out:mimir -o:speed

      - name: Fetch typeshed stubs
        run: ./mimir stubs fetch

      - name: Run conformance tests
        run: ./mimir conform tests/conformance/

      - name: Run smoke tests
        run: |
          for f in tests/smoke/*.py; do
            echo "checking $f..."
            ./mimir check "$f"
          done

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mimir-${{ matrix.target }}
          path: mimir

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
